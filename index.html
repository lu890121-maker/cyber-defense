<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>赛博防线：机械入侵</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0B0E14;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            touch-action: none;
        }

        /* 背景：暗底 + 40px 赛博网格（与画布内网格同一套视觉语言） */
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0B0E14;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(rgba(0, 240, 255, 0.11) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.11) 1px, transparent 1px),
                radial-gradient(ellipse at 50% 40%, #101827 0%, #0B0E14 55%, #05070C 100%);
            background-size: 40px 40px, 40px 40px, 200px 200px, 200px 200px, 100% 100%;
        }

        #gameCanvas {
            background: #0B0E14;
            box-shadow:
                0 0 0 1px rgba(0, 240, 255, 0.35),
                0 0 34px rgba(0, 240, 255, 0.22),
                0 0 90px rgba(157, 0, 255, 0.16);
            max-width: 100%;
            max-height: 100%;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00F0FF;
            font-size: 20px;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.75);
            animation: pulse 1.4s ease-in-out infinite;
        }

        #loading.hidden {
            display: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="loading">正在接入防线…</div>
        <canvas id="gameCanvas"></canvas>
    </div>
    <script type="module" src="./game/main.js"></script>
</body>
</html>
